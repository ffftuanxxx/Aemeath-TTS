<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f6">
  <meta name="description" content="Aemeath-TTS — 等待数据披露中，请稍等哦。">
  <title>Aemeath-TTS · 请稍等哦</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #533941; --muted: #8b727b; --rose: #bf617f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink); background: #fff8f6;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-width: 280px; }
    button { font: inherit; }
    .page {
      position: relative; isolation: isolate; display: flex; flex-direction: column;
      min-height: 100vh; min-height: 100svh; overflow: hidden;
      background: radial-gradient(ellipse at 50% 39%, #fffefd 0%, #fffefd00 55%), linear-gradient(130deg, #fff8f3 0%, #fff6f7 53%, #f6f2ff 100%);
    }
    .haze { position: absolute; pointer-events: none; z-index: -1; width: 560px; height: 560px; border-radius: 50%; filter: blur(65px); opacity: .48; }
    .haze.one { top: 17%; left: -310px; background: #f7d2d8; animation: drift 17s ease-in-out infinite alternate; }
    .haze.two { bottom: -320px; right: -100px; background: #ded6f8; animation: drift 19s ease-in-out -7s infinite alternate-reverse; }
    .haze.three { top: -380px; right: 5%; background: #f6dec9; animation: drift 22s ease-in-out -3s infinite alternate; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 30px 44px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 650; letter-spacing: .025em; white-space: nowrap; }
    .brand-mark { display: flex; align-items: center; gap: 3px; width: 31px; height: 31px; justify-content: center; background: #ffffffb5; border: 1px solid #e9dadd; border-radius: 11px; }
    .brand-mark i { width: 3px; border-radius: 5px; background: var(--rose); height: 9px; }
    .brand-mark i:nth-child(2) { height: 17px; }
    .brand-mark i:nth-child(3) { height: 12px; }
    .top-label { color: var(--muted); font-size: 10px; letter-spacing: .2em; }
    main { display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 28px 24px 76px; text-align: center; }
    .art { position: relative; width: 340px; height: 280px; margin: 0 0 26px; flex-shrink: 0; }
    .orbit { position: absolute; left: 50%; top: 50%; border: 1px solid #bd789332; border-radius: 50%; }
    .orbit.outer { width: 270px; height: 270px; margin: -135px; animation: spin 32s linear infinite; }
    .orbit.inner { width: 216px; height: 216px; margin: -108px; border-style: dashed; border-color: #bd789326; animation: spin 42s linear infinite reverse; }
    .orbit.outer::before, .orbit.outer::after { content: ""; position: absolute; border-radius: 50%; }
    .orbit.outer::before { width: 11px; height: 11px; left: 43px; top: 29px; background: #ce8fa7; box-shadow: 0 0 0 6px #ce8fa713; }
    .orbit.outer::after { width: 7px; height: 7px; right: 28px; bottom: 40px; background: #baa9d8; box-shadow: 0 0 0 5px #baa9d815; }
    .aura { position: absolute; width: 188px; height: 188px; left: 76px; top: 46px; border-radius: 50%; background: radial-gradient(circle, #ebbac977, #edcad72b 59%, transparent 71%); animation: breathe 4s ease-in-out infinite; }
    .orb-wrap { position: absolute; left: 95px; top: 65px; width: 150px; height: 150px; animation: float 5s ease-in-out infinite; }
    .orb {
      display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
      border-radius: 43% 57% 55% 45% / 48% 43% 57% 52%; border: 1px solid #ffffffcf;
      background: radial-gradient(circle at 28% 23%, #fff 0%, #fff7f9 26%, #f4d5e2 67%, #dac9ee 100%);
      box-shadow: inset 5px 8px 20px #ffffffb5, inset -7px -10px 20px #c58fad26, 0 22px 42px -15px #a8789257;
      animation: morph 10s ease-in-out infinite;
    }
    .waveform { display: flex; align-items: center; justify-content: center; gap: 5px; height: 60px; }
    .waveform i { display: block; width: 5px; height: var(--height); border-radius: 9px; background: linear-gradient(#bb6384, #b397d4); animation: wave 1.45s ease-in-out var(--delay) infinite; }
    .spark { position: absolute; width: 16px; height: 16px; animation: twinkle 4s ease-in-out infinite; }
    .spark::before, .spark::after { content: ""; position: absolute; left: 50%; top: 50%; border-radius: 100%; transform: translate(-50%, -50%); background: #c891a8; }
    .spark::before { width: 3px; height: 100%; }
    .spark::after { width: 100%; height: 3px; }
    .spark.a { left: 29px; top: 52px; }
    .spark.b { right: 19px; bottom: 60px; width: 12px; height: 12px; animation-delay: -2s; }
    .spark.c { right: 60px; top: 24px; width: 9px; height: 9px; animation-delay: -1s; }
    .particle { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #bf8aab80; animation: float 6s ease-in-out infinite; }
    .particle.a { left: 72px; bottom: 32px; }
    .particle.b { right: 26px; top: 105px; width: 3px; height: 3px; animation-delay: -2s; }
    .particle.c { left: 15px; top: 165px; width: 3px; height: 3px; animation-delay: -4s; }
    .eyebrow { margin: 0 0 18px; color: var(--rose); font-size: 10px; font-weight: 600; letter-spacing: .3em; }
    h1 { margin: 0; font-size: clamp(29px, 5.2vw, 46px); font-weight: 550; line-height: 1.5; letter-spacing: .04em; }
    h1 span { color: var(--rose); }
    .subtitle { margin: 15px 0 0; color: var(--muted); font-size: 18px; line-height: 1.8; letter-spacing: .12em; }
    .waiting { display: inline-flex; align-items: center; justify-content: center; gap: 10px; margin-top: 33px; padding: 10px 17px; border: 1px solid #e5d4dc; border-radius: 999px; background: #ffffff80; color: #86616f; font-size: 11px; letter-spacing: .06em; }
    .dots { display: flex; gap: 4px; }
    .dots i { width: 4px; height: 4px; border-radius: 50%; background: #b5708c; animation: bounce 1.5s ease-in-out infinite; }
    .dots i:nth-child(2) { animation-delay: .18s; }
    .dots i:nth-child(3) { animation-delay: .36s; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 44px; color: #907781; font-size: 11px; letter-spacing: .04em; }
    .motion-button { display: inline-flex; align-items: center; gap: 7px; padding: 9px 11px; border: 1px solid transparent; border-radius: 8px; color: #80616d; background: transparent; cursor: pointer; font-size: 11px; }
    .motion-button:hover { background: #ffffff88; border-color: #e5d4dc; }
    .motion-button:focus-visible { outline: 2px solid #bd718e; outline-offset: 3px; }
    .motion-icon { width: 10px; height: 10px; border-left: 3px solid currentColor; border-right: 3px solid currentColor; }
    body.paused .motion-icon { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid currentColor; border-right: 0; }
    body.paused *, body.paused *::before, body.paused *::after { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }
    @keyframes breathe { 0%, 100% { transform: scale(.94); opacity: .65; } 50% { transform: scale(1.15); opacity: 1; } }
    @keyframes morph { 0%, 100% { border-radius: 43% 57% 55% 45% / 48% 43% 57% 52%; } 50% { border-radius: 57% 43% 43% 57% / 54% 57% 43% 46%; } }
    @keyframes wave { 0%, 100% { transform: scaleY(.38); } 50% { transform: scaleY(1); } }
    @keyframes twinkle { 0%, 100% { transform: scale(.75) rotate(0deg); opacity: .35; } 50% { transform: scale(1.1) rotate(15deg); opacity: .9; } }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-3px); opacity: 1; } }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(75px, -35px); } }
    @media (max-width: 540px) {
      .topbar { padding: 24px; }
      .top-label { font-size: 9px; letter-spacing: .1em; }
      main { padding: 32px 16px 56px; }
      .art { margin-bottom: 8px; transform: scale(.88); }
      .subtitle { font-size: 16px; }
      footer { padding: 18px 24px; font-size: 10px; }
    }
    @media (max-width: 350px) { .top-label { display: none; } h1 { font-size: 27px; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .motion-button { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="haze one" aria-hidden="true"></div>
    <div class="haze two" aria-hidden="true"></div>
    <div class="haze three" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Aemeath-TTS</div>
      <span class="top-label">SOMETHING GOOD IS COMING</span>
    </header>
    <main>
      <div class="art" aria-hidden="true">
        <div class="orbit outer"></div><div class="orbit inner"></div><div class="aura"></div>
        <div class="orb-wrap"><div class="orb"><div class="waveform">
          <i style="--height:16px;--delay:-.8s"></i>
          <i style="--height:29px;--delay:-.6s"></i>
          <i style="--height:41px;--delay:-.4s"></i>
          <i style="--height:54px;--delay:-.2s"></i>
          <i style="--height:42px;--delay:0s"></i>
          <i style="--height:31px;--delay:-.25s"></i>
          <i style="--height:19px;--delay:-.5s"></i>
        </div></div></div>
        <span class="spark a"></span><span class="spark b"></span><span class="spark c"></span>
        <span class="particle a"></span><span class="particle b"></span><span class="particle c"></span>
      </div>
      <p class="eyebrow">A LITTLE PATIENCE, PLEASE</p>
      <h1>等待数据<span>披露中</span></h1>
      <p class="subtitle">请稍等哦。</p>
      <div class="waiting"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>Demo coming soon</div>
    </main>
    <footer>
      <span>Aemeath-TTS · Stay tuned.</span>
      <button class="motion-button" id="motion-toggle" type="button" aria-pressed="false" hidden>
        <span class="motion-icon" aria-hidden="true"></span><span id="motion-label">暂停动画</span>
      </button>
    </footer>
  </div>
  <script>
    "use strict";
    const toggle = document.getElementById("motion-toggle");
    toggle.hidden = false;
    toggle.addEventListener("click", function () {
      const paused = document.body.classList.toggle("paused");
      toggle.setAttribute("aria-pressed", String(paused));
      document.getElementById("motion-label").textContent = paused ? "继续动画" : "暂停动画";
    });
  </script>
</body>
</html>
